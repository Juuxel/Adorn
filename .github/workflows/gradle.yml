# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Build
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: 25
      - name: Build with Gradle
        run: ./gradlew build --stacktrace
  check_resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: 25
      - name: Generate resources (common data)
        run: ./gradlew :fabric:runCommonData
      - name: Generate resources (Fabric data)
        run: ./gradlew :fabric:runData
      - name: Generate resources (mod compatibility)
        run: ./gradlew generateAllData
      - name: Reformat translations
        run: ./gradlew :common:reformatTranslations
      - name: Check for changes
        run: python ./build-logic/check_and_package_git_diff.py
      - name: Upload changed resources
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Changed resources
          path: diff.zip
          archive: false
