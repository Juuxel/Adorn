# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Build
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [
          21 # Target
        ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: ${{ matrix.java }}
      - name: Build with Gradle
        run: ./gradlew build --stacktrace
  check_resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: 21
      - name: Generate resources (common data)
        run: ./gradlew :fabric:runCommonData
      - name: Generate resources (Fabric data)
        run: ./gradlew :fabric:runData
      - name: Generate resources (mod compatibility)
        run: ./gradlew generateAllData
      - name: Check for changes
        run: if [ -n "$(git status --porcelain)" ]; then git status; exit 1; fi
